apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-frontend" .Release.Name }}
  labels:
    app: {{ include "movie.name" . }}
    component: frontend
spec:
  type: {{ .Values.service.frontend.type }}
  selector:
    app: {{ include "movie.name" . }}
    component: frontend
  ports:
    - port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.targetPort }}
      protocol: TCP
      name: http
