apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-postgres" .Release.Name }}
  labels:
    app: {{ include "movie-charts.name" . }}
    component: postgres
spec:
  type: ClusterIP
  selector:
    app: {{ include "movie-charts.name" . }}
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
