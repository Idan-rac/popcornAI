apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ printf "%s-backend" .Release.Name }}
  labels:
    app: {{ include "movie-charts.name" . }}
    component: backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: {{ include "movie-charts.name" . }}
      component: backend
  template:
    metadata:
      labels:
        app: {{ include "movie-charts.name" . }}
        component: backend
    spec:
      {{- if .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.backend.targetPort }}
          {{- if .Values.env.backend }}
          env:
            {{- range $key, $value := .Values.env.backend }}
            {{- if ne $value "" }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          envFrom:
            - secretRef:
                name: movie-app-secrets
          resources:
            {{- toYaml .Values.resources.backend | nindent 12 }}
          {{- if .Values.livenessProbe.backend.enabled }}
          livenessProbe:
            httpGet:
              path: {{ .Values.livenessProbe.backend.path }}
              port: {{ .Values.livenessProbe.backend.port }}
            initialDelaySeconds: {{ .Values.livenessProbe.backend.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.backend.periodSeconds }}
          {{- end }}
          {{- if .Values.readinessProbe.backend.enabled }}
          readinessProbe:
            httpGet:
              path: {{ .Values.readinessProbe.backend.path }}
              port: {{ .Values.readinessProbe.backend.port }}
            initialDelaySeconds: {{ .Values.readinessProbe.backend.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.backend.periodSeconds }}
          {{- end }}
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 8 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 8 }}
