apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.backend.name }}
  labels:
    app: {{ .Values.global.app }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.global.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.global.app }}
    spec:
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image }}"
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: "{{ $value }}"
            {{- end }}


            - name: DB_USER
              value: "{{ .Values.database.user }}"
            - name: DB_NAME
              value: "{{ .Values.database.name }}"
            # These environment variables are sensitive and should be stored in a secret.
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  # This should be the name of your secret.
                  name: movie-db-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  # This should be the name of your secret.
                  name: movie-db-secret
                  key: JWT_SECRET